<link rel="stylesheet" href="fix.css">
<script>
(function () {
  "use strict";

  /* Top bar showing the page title as a real <h1> (good for SEO). */
  if (document.title.trim().toLowerCase() === "table") {
    document.title = "UK Visa Sponsor Companies — Full List, Updated Weekly";
  }
  var main = document.querySelector("main.csvtotable");
  if (main) {
    var bar = document.createElement("nav");
    bar.id = "csvtotable-topbar";
    bar.setAttribute("aria-label", "Page title");
    var title = document.createElement("h1");
    title.className = "csvtotable-topbar-title";
    var raw = document.title || "";
    if (!raw || raw.trim().toLowerCase() === "table") raw = "UK Visa Sponsor Company list";
    var cut = raw.indexOf(" from ");
    title.textContent = cut > 0 ? raw.slice(0, cut) : raw;
    if (cut > 0) {
      var date = document.createElement("span");
      date.className = "csvtotable-topbar-date";
      date.textContent = raw.slice(cut + 6);
      title.appendChild(date);
    }
    bar.appendChild(title);
    main.insertBefore(bar, main.firstChild);
  }

  /* Emergency readability guard: the site is always light now, but if some
     engine or extension still renders unreadable text, drop in concrete
     colours as a last resort. */
  function parseColor(s) {
    s = (s || "").trim();
    var m;
    if ((m = s.match(/^#([0-9a-f]{3})$/i))) {
      return [
        parseInt(m[1].charAt(0) + m[1].charAt(0), 16),
        parseInt(m[1].charAt(1) + m[1].charAt(1), 16),
        parseInt(m[1].charAt(2) + m[1].charAt(2), 16)
      ];
    }
    if ((m = s.match(/^#([0-9a-f]{6})$/i))) {
      return [
        parseInt(s.slice(1, 3), 16),
        parseInt(s.slice(3, 5), 16),
        parseInt(s.slice(5, 7), 16)
      ];
    }
    if ((m = s.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/))) {
      return [+m[1], +m[2], +m[3]];
    }
    return null;
  }

  function lum(c) {
    var f = function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
  }

  function contrast(c1, c2) {
    var l1 = lum(c1), l2 = lum(c2);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }

  var healed = false;

  function heal() {
    if (healed) return;
    try {
      var td = document.querySelector("table.dataTable tbody tr td");
      var fg, bg;
      if (td) {
        fg = parseColor(getComputedStyle(td).color);
        bg = parseColor(getComputedStyle(document.body).backgroundColor);
      } else {
        var cs = getComputedStyle(document.documentElement);
        fg = parseColor(cs.getPropertyValue("--ct-ink"));
        bg = parseColor(cs.getPropertyValue("--ct-paper"));
      }
      if (!fg || !bg) return;
      if (contrast(fg, bg) < 2) {
        healed = true;
        var s = document.createElement("style");
        s.textContent =
          "html,body{background:#fff !important}" +
          "body{color:#15181d !important}" +
          "table.dataTable>tbody>tr>td{color:#15181d !important}";
        document.head.appendChild(s);
        if (window.console) {
          console.warn("uk-visa-sponsor: unreadable colours were detected and reset to light.");
        }
      }
    } catch (e) { /* ignore */ }
  }

  heal();
  document.addEventListener("DOMContentLoaded", heal);
  window.addEventListener("load", heal);

  /* The table builds after the gzipped bundle unpacks; re-check once
     real rows exist. */
  var tries = 0;
  var timer = setInterval(function () {
    if (healed || document.querySelector("table.dataTable tbody tr td") || ++tries > 120) {
      clearInterval(timer);
      heal();
    }
  }, 500);

  /* Clicking a company row opens a Google search for it
     (replacement for the old jQuery handler that stopped working
     when the page switched to the csvtotable renderer). */
  var table = document.getElementById("csvtotable-table");
  if (table) {
    table.addEventListener("click", function (ev) {
      var tr = ev.target && ev.target.closest ? ev.target.closest("tbody tr") : null;
      if (!tr) return;
      var td = tr.querySelector("td");
      if (!td) return;
      var name = (td.textContent || "").trim();
      if (!name) return;
      var url = "https://www.google.com/search?q=" +
        encodeURIComponent(name.replace(/-/g, " ") + " gov uk");
      window.open(url, "_blank", "noopener");
    });
  }
})();
</script>
